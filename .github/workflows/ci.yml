name: CI

# Free checks for every PR. Nothing here touches signing or the paid macOS
# runners; those live in codemagic.yaml and are started by hand.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  # Keep in step with codemagic.yaml.
  FLUTTER_VERSION: "3.47.6"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: analyze + test (TZ=${{ matrix.tz }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Campus time is America/New_York whatever the device says, so the
        # whole suite runs in zones on both sides of it plus UTC.
        tz: [America/New_York, America/Los_Angeles, Asia/Tokyo, UTC]
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze
        if: matrix.tz == 'America/New_York'
        run: flutter analyze
      - name: Test
        env:
          TZ: ${{ matrix.tz }}
        run: flutter test

  repo-hygiene:
    name: plist, secrets, http
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -I scripts/ci-checks.py

  build-linux:
    name: build linux
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - name: Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build linux --release

  build-android:
    name: build android (debug apk)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --debug
