# Signed app bundle to Play internal testing. Manual start only.
#
# Secrets (repo Settings > Secrets and variables > Actions):
#   ANDROID_KEYSTORE_BASE64    the upload keystore, base64 encoded
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
#   PLAY_SERVICE_ACCOUNT_JSON  the service account key, with release rights on this app
#
# The first bundle has to be uploaded by hand in Play Console. After that this
# workflow can ship every build.
name: android release

on:
  workflow_dispatch:
    inputs:
      track:
        description: Play track
        type: choice
        default: internal
        options: [internal, alpha, beta]
      upload:
        description: Upload to Play, off builds the bundle only
        type: boolean
        default: true

env:
  FLUTTER_VERSION: "3.47.6"

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Upload key
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
      - run: flutter pub get
      - name: Build the bundle
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        # the run number is the version code, so every upload is newer than the last
        run: flutter build appbundle --release --build-number=${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: tigerhub-aab
          path: client/build/app/outputs/bundle/release/app-release.aab
      - name: Upload to Play
        if: ${{ inputs.upload }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: dev.colewiz.tigerhub
          releaseFiles: client/build/app/outputs/bundle/release/app-release.aab
          track: ${{ inputs.track }}
          status: completed
