# Standalone Docker on the Debian box, deliberately outside the k3s cluster.
# See CLAUDE.md section 3. This is a conscious choice for a small personal
# service, not an oversight, and it is not GitOps managed by Argo CD.

services:
  tigerhub-api:
    build: .
    image: tigerhub-api:latest
    container_name: tigerhub-api
    restart: unless-stopped
    environment:
      # Honest, identifiable contact on every outbound request.
      RIT_TIMES_CONTACT: "${RIT_TIMES_CONTACT:-colewiz72@gmail.com}"
      RIT_TIMES_DB: /srv/data/rit_times.db
      # Scrape cadence, in minutes. See CLAUDE.md section 6.
      RIT_TIMES_INTERVAL_DINING: "60"
      RIT_TIMES_INTERVAL_EVENTS: "180"
      RIT_TIMES_INTERVAL_MAKERSPACE: "15"
      RIT_TIMES_INTERVAL_OCCUPANCY: "5"
      RIT_TIMES_CONFIG_STALE_DAYS: "120"
    volumes:
      # Named volume so the SQLite cache survives a rebuild.
      - tigerhub-data:/srv/data

    # ---------------------------------------------------------------------
    # ROUTING AND TLS: NOT YET WRITTEN, ON PURPOSE.
    #
    # Cloudflare Tunnel terminates TLS at the edge, so this almost certainly
    # needs no certresolver and no TLS block at all. Rather than invent a
    # config that half works, this is left blank until the labels from the
    # existing lore.colewiz.dev service are copied here verbatim, with the
    # host swapped to tigerhub.colewiz.dev and the port to 8000.
    #
    # Whatever that pattern is (Traefik labels, a cloudflared ingress entry in
    # config.yml, or a docker network the tunnel already sits on), copy it,
    # do not reinvent it.
    # ---------------------------------------------------------------------

    # If the tunnel reaches containers over a shared network, uncomment and
    # set the real network name from the lore service.
    # networks:
    #   - <network-from-lore>

# networks:
#   <network-from-lore>:
#     external: true

volumes:
  tigerhub-data:
